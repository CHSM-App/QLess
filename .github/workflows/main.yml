name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  # Manual "Run workflow" button for Play Store deploys. Nothing is ever pushed
  # to the Play Store automatically — you trigger this deliberately and pick the
  # track / priority / rollout each time.
  workflow_dispatch:
    inputs:
      track:
        description: 'Target: internal, sharing (Internal App Sharing link) or production'
        type: choice
        default: internal
        options:
          - internal
          - sharing
          - production
      priority:
        description: 'In-app update priority (0-5). 5 = forced full-screen update.'
        type: string
        default: '0'
      fraction:
        description: 'Staged rollout fraction for production (e.g. 0.1 = 10%, 1 = 100%).'
        type: string
        default: '0.1'
      dry_run:
        description: 'Dry run — validate + authenticate but do NOT upload.'
        type: boolean
        default: true

permissions:
  contents: write

env:
  BACKEND_DIR: backend
  BACKEND_BRANCH: backend
  FLUTTER_VERSION: '3.35.2'

jobs:
  # ── Job 1: Flutter tests ────────────────────────────────────────────────────
  test-flutter:
    name: Flutter tests
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run Flutter tests with coverage
        working-directory: frontend
        run: flutter test --coverage

      - name: Upload Flutter coverage report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: frontend/coverage/
          retention-days: 14

  # ── Job 1b: Backend tests, coverage threshold, lint, audit ─────────────────
  # Tests use a mocked database (tests/setup.js), so no SQL Server is needed.
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Tests with coverage threshold
        working-directory: backend
        run: npm run test:coverage

      - name: Audit production dependencies (high and critical fail)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

  # ── Job 2: Build landing page, copy into backend/public/, sync backend branch
  # Only after the backend tests pass: Plesk deploys from that branch.
  sync-backend:
    name: Build landing page + sync backend branch
    runs-on: ubuntu-latest
    needs: test-backend
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install landing page dependencies
        working-directory: landing
        run: npm ci

      - name: Build landing page (outputs to backend/public/)
        working-directory: landing
        run: npm run build
        env:
          VITE_API_URL: ''

      - name: Install backend production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Remove backend/public/ exclusion so it gets deployed
        run: sed -i '/^backend\/public\//d' .gitignore

      - name: Push backend folder to backend branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ env.BACKEND_BRANCH }}
          publish_dir: ./${{ env.BACKEND_DIR }}
          force_orphan: true
          commit_message: "sync: backend + landing page from ${{ github.ref_name }} @ ${{ github.sha }}"

  # ── Job 3: Build Flutter APK + AAB on tag push (v*) ────────────────────────
  build-apk:
    name: Build Flutter APK + AAB
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        # tr -d strips stray spaces/newlines the secret box may have added.
        run: printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > frontend/android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        # build.gradle.kts silently falls back to debug signing when any is blank.
        run: |
          [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]             || { echo "::error::STORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS secret missing"; exit 1; }
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n'   "$KEY_PASSWORD"
            printf 'keyAlias=%s\n'      "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > frontend/android/key.properties

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > frontend/android/app/google-services.json
          jq -e '.project_info.project_id' frontend/android/app/google-services.json > /dev/null             || { echo "::error::GOOGLE_SERVICES_JSON secret is empty or not the raw google-services.json"; exit 1; }

      - name: Build APK (release)
        working-directory: frontend
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build AAB (release)
        working-directory: frontend
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Rename APK and AAB with tag version
        run: |
          mv frontend/build/app/outputs/flutter-apk/app-release.apk \
            frontend/build/app/outputs/flutter-apk/qless-${{ github.ref_name }}.apk
          mv frontend/build/app/outputs/bundle/release/app-release.aab \
            frontend/build/app/outputs/bundle/release/qless-${{ github.ref_name }}.aab

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: qless-apk-${{ github.ref_name }}
          path: frontend/build/app/outputs/flutter-apk/qless-*.apk
          retention-days: 30

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: qless-aab-${{ github.ref_name }}
          path: frontend/build/app/outputs/bundle/release/qless-*.aab
          retention-days: 30

      - name: Create GitHub Release with APK and AAB
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/build/app/outputs/flutter-apk/qless-*.apk
            frontend/build/app/outputs/bundle/release/qless-*.aab

  # ── Job 4: Deploy signed AAB to the Play Store ─────────────────────────────
  # Manual only — triggered from the Actions tab via "Run workflow". Builds a
  # fresh signed AAB and hands it to deploy/deploy.js, which uploads it.
  deploy-playstore:
    name: Deploy to Play Store
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        # tr -d strips stray spaces/newlines the secret box may have added.
        run: printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > frontend/android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        # build.gradle.kts silently falls back to debug signing when any is blank.
        run: |
          [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]             || { echo "::error::STORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS secret missing"; exit 1; }
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n'   "$KEY_PASSWORD"
            printf 'keyAlias=%s\n'      "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > frontend/android/key.properties

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > frontend/android/app/google-services.json
          jq -e '.project_info.project_id' frontend/android/app/google-services.json > /dev/null             || { echo "::error::GOOGLE_SERVICES_JSON secret is empty or not the raw google-services.json"; exit 1; }

      - name: Write Play service account
        env:
          PLAY_SA_BASE64: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          printf '%s' "$PLAY_SA_BASE64" | tr -d '[:space:]' | base64 --decode > deploy/service-account.json
          jq -e '.private_key and .client_email' deploy/service-account.json > /dev/null             || { echo "::error::PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64 secret is empty or not a base64 service-account key"; exit 1; }

      - name: Build AAB (release)
        working-directory: frontend
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Install deploy dependencies
        working-directory: deploy
        run: npm ci

      - name: Deploy to Play Store
        working-directory: deploy
        env:
          TRACK: ${{ inputs.track }}
          PRIORITY: ${{ inputs.priority }}
          FRACTION: ${{ inputs.fraction }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS="--yes --track=$TRACK --priority=$PRIORITY"
          if [ "$TRACK" = "production" ]; then
            if [ "$FRACTION" = "1" ] || [ "$FRACTION" = "1.0" ]; then ARGS="$ARGS --force"; else ARGS="$ARGS --fraction=$FRACTION"; fi
          fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "node deploy.js $ARGS"
          node deploy.js $ARGS

      - name: Clean up secrets
        if: always()
        run: |
          rm -f deploy/service-account.json frontend/android/key.properties \
                frontend/android/app/upload-keystore.jks frontend/android/app/google-services.json
