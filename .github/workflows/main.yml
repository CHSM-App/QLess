on:
  workflow_dispatch:        
  push:
    tags:
      - 'v*'              

name: "Build & Release"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true

      - run: flutter pub get
        working-directory: frontend

      - name: Run tests
        run: flutter test --coverage
        working-directory: frontend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info

  sync-backend:
    name: Sync Backend to Branch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push backend folder to backend branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.TOKEN }}@github.com/${{ github.repository }}.git
          cp -r backend /tmp/backend-content
          git checkout --orphan backend-tmp
          git rm -rf . --quiet
          cp -r /tmp/backend-content/. .
          git add -A
          git commit -m "sync: update backend from ${{ github.ref_name }}"
          git push origin backend-tmp:backend --force

  build:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: test                
    permissions:
      contents: write           

    steps:
      - uses: actions/checkout@v3

      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true

      - run: flutter pub get
        working-directory: frontend

      - run: flutter build apk --release --split-per-abi
        working-directory: frontend

      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "frontend/build/app/outputs/apk/release/*"
          tag: ${{ github.ref_name }}
          allowUpdates: true
          token: ${{ secrets.TOKEN }}