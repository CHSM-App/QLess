name: qless
description: "A new Flutter project."
publish_to: 'none'
# Version format: X.Y.Z+N
#   X.Y.Z = versionName (semver, user-visible)
#   N     = versionCode (strictly increasing integer per store upload)
# Play and App Store reject uploads whose versionCode/CFBundleVersion is
# not strictly greater than the previous build, so always bump N — even
# for a hotfix that keeps the same X.Y.Z.
# Bump via: scripts/bump-version.ps1 -Type patch (or minor/major).
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  safe_device: ^1.1.0
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  url_launcher: ^6.3.2
  
  

  # State & Storage
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  

  # Firebase
  # Firebase plugins must move together: firebase_messaging depends on a
  # specific firebase_core range. If you bump one major version, bump the
  # rest in lockstep. Run `flutter pub outdated` before bumping to see
  # current upstream and confirm the matrix.
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3


  # Networking
  dio: ^5.9.0
  retrofit: 4.9.2
  http: ^1.6.0
  connectivity_plus: 7.0.0

  # Serialization
  json_annotation: 4.9.0
  freezed_annotation: ^3.1.0

  # Device / Media
  #image_picker: ^1.2.1
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  path: ^1.9.0

  # Offline-first local storage
  sqflite: ^2.4.2

  # PDF generation (prescription printout — print_prescription_screen.dart)
  printing: ^5.12.0
  pdf: ^3.10.7

  image_picker: ^1.1.2         # For camera and gallery
  file_picker: ^8.1.2
 
  open_file: ^3.3.2 
  share_plus: ^12.0.1
  path_provider: ^2.1.2
  flutter_local_notifications: ^17.2.0

  google_maps_flutter: ^2.6.0
  flutter_polyline_points: ^2.0.1
  font_awesome_flutter: ^10.7.0

  geocoding: ^2.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

  # Code generation (LOCKED — THIS IS CRITICAL)
  retrofit_generator: ^10.2.1
  json_serializable: ^6.11.4
  freezed: ^3.2.4
  build_runner: ^2.10.5

flutter:
  uses-material-design: true
  generate: true
  # assets:
  #   - asset/sound/success.mp3
